<g font-family="Arial,sans-serif" fill="#222" text-anchor="middle"><text x="768" y="316" font-size="22">O Pró-Reitor da Universidade Cruzeiro do Sul, no uso de suas atribuições e</text><text x="768" y="344" font-size="22">tendo em vista a colação de grau do Curso Superior de Tecnologia em Análise e Desenvolvimento de Sistemas,</text><text x="768" y="372" font-size="22">em 30 de agosto de 2024, confere o título de</text><text x="768" y="424" font-size="27" font-weight="700">Tecnólogo em Análise e Desenvolvimento de Sistemas a</text><text x="768" y="486" font-size="48" font-weight="700">ANDERSON JHONATAN DOS SANTOS</text></g>
